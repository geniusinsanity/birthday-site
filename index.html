<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title data-i18n="title">Happy Birthday Zahra 🎁</title>
    <meta name="description" content="A special birthday surprise! A beautiful interactive site with animations, music, memories, and 3D cake!">

    <!-- Favicon and Icons -->
    <link rel="icon" href="./image/logo.png" type="image/png">
    <link rel="apple-touch-icon" href="./image/logo.png">

    <!-- PWA Settings -->
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#ff69b4">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500;700&family=Pacifico&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="./css/style.css?v=3">
</head>

<body>
    <!-- Matrix Rain Canvas & Main Particle Canvas -->
    <canvas id="matrix-rain"></canvas>
    <canvas class="canvas"></canvas>

    <div class="overlay">
        <!-- Floating Stars Container -->
        <div class="stars-container" id="starsContainer"></div>

        <!-- Romantic Typewriter Message Box -->
        <div class="content-display" id="contentDisplay">
            <p id="contentText"></p>
        </div>

        <!-- 3D Photo Album (Book) -->
        <div class="book-container" id="bookContainer">
            <div class="book" id="book"></div>
        </div>

        <!-- Fireworks & Confetti Container -->
        <div class="firework-container" id="fireworkContainer"></div>

        <!-- Floating Romantic Controls (Top Right) -->
        <div class="top-controls">
            <button class="control-btn music-control" id="musicControl" title="Play/Pause Music">
                ▶
            </button>
            <button class="control-btn lang-switch-btn" id="langSwitchBtn" title="Switch Language">
                EN
            </button>
            <button class="control-btn settings-button" id="settingsButton" title="Settings">
                ⚙
            </button>
        </div>

        <!-- Settings Hint -->
        <div id="settingsHint" class="settings-hint">
            <div class="hint-text" data-i18n="settingsHint">click here to customize settings</div>
        </div>

        <!-- Settings Modal -->
        <div id="settingsModal" class="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2 data-i18n="settings">⚙️ Website Settings</h2>
                    <span class="close" id="closeSettingsModal">×</span>
                </div>
                <div class="modal-body">
                    
                    <!-- Color Theme Selection -->
                    <div class="settings-section">
                        <h3 data-i18n="colorTheme">🎨 Choose Color Theme</h3>
                        <div class="form-group">
                            <div class="color-theme-buttons">
                                <button type="button" class="color-theme-btn active" data-theme="pink">
                                    <div class="color-preview pink-preview"></div>
                                    <span data-i18n="pinkTheme">Sweet Pink</span>
                                </button>
                                <button type="button" class="color-theme-btn" data-theme="blue">
                                    <div class="color-preview blue-preview"></div>
                                    <span data-i18n="blueTheme">Cool Blue</span>
                                </button>
                                <button type="button" class="color-theme-btn" data-theme="purple">
                                    <div class="color-preview purple-preview"></div>
                                    <span data-i18n="purpleTheme">Dreamy Purple</span>
                                </button>
                                <button type="button" class="color-theme-btn" data-theme="custom">
                                    <div class="color-preview custom-preview"></div>
                                    <span data-i18n="customTheme">Custom Color</span>
                                </button>
                            </div>
                        </div>
                        <div class="form-row" id="customColorSection" style="display: none; margin-top: 10px;">
                            <div class="form-group">
                                <label for="matrixColor1" data-i18n="matrixColor1">Matrix Color 1:</label>
                                <input type="color" id="matrixColor1" value="#ff69b4">
                            </div>
                            <div class="form-group">
                                <label for="matrixColor2" data-i18n="matrixColor2">Matrix Color 2:</label>
                                <input type="color" id="matrixColor2" value="#ff1493">
                            </div>
                            <div class="form-group">
                                <label for="sequenceColor" data-i18n="sequenceColor">Particle Text Color:</label>
                                <input type="color" id="sequenceColor" value="#ff69b4">
                            </div>
                        </div>
                    </div>

                    <!-- Music Settings -->
                    <div class="settings-section">
                        <h3 data-i18n="music">🎵 Music Settings</h3>
                        <div class="form-group">
                            <label for="backgroundMusic" data-i18n="backgroundMusic">Background Music:</label>
                            <select id="backgroundMusic"></select>
                        </div>
                    </div>

                    <!-- Countdown Settings -->
                    <div class="settings-section">
                        <h3 data-i18n="countdown">⏳ Countdown Settings</h3>
                        <div class="form-group">
                            <label for="countdownTime" data-i18n="countdownTime">Countdown Time (seconds):</label>
                            <input type="number" id="countdownTime" value="3" min="1" max="10">
                        </div>
                    </div>

                    <!-- Main Text Sequence -->
                    <div class="settings-section">
                        <h3 data-i18n="sequence">📝 Main Text Settings</h3>
                        <div class="form-group">
                            <label for="sequenceText" data-i18n="sequenceText">Main text content (separated by |):</label>
                            <input type="text" id="sequenceText" value="HAPPY|BIRTHDAY|TO|YOU|ZAHRA|❤">
                        </div>
                    </div>

                    <!-- Matrix Rain Settings -->
                    <div class="settings-section">
                        <h3 data-i18n="matrix">🔢 Matrix Effect Settings</h3>
                        <div class="form-group">
                            <label for="matrixText" data-i18n="matrixText">Matrix falling text:</label>
                            <input type="text" id="matrixText" value="HAPPYBIRTHDAY">
                        </div>
                    </div>

                    <!-- Book & Features Settings -->
                    <div class="settings-section">
                        <h3 data-i18n="book">📖 Book & Features Settings</h3>
                        <div class="form-group">
                            <label for="enableBook" data-i18n="enableBook">Show Book:</label>
                            <select id="enableBook">
                                <option value="true" data-i18n="on">On</option>
                                <option value="false" data-i18n="off">Off</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="enableHeart" data-i18n="enableHeart">Show Heart Effect:</label>
                            <select id="enableHeart">
                                <option value="true" data-i18n="on">On</option>
                                <option value="false" data-i18n="off">Off</option>
                            </select>
                        </div>
                        <div id="bookSettingsSection">
                            <div id="pageConfigs"></div>
                        </div>
                        <div class="form-group" style="margin-top: 12px;">
                            <label for="isSave" style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
                                <input type="checkbox" id="isSave"> <span data-i18n="saveSettings">Save settings on this device</span>
                            </label>
                        </div>
                    </div>

                    <button id="applySettings" class="apply-settings-btn" data-i18n="apply">🎉 Apply Settings</button>
                </div>
            </div>
        </div>

        <!-- Audio Element -->
        <audio id="birthdayAudio" loop preload="auto">
            <source src="./music/zahra.mp3" type="audio/mpeg">
            Your browser does not support the audio element.
        </audio>

        <!-- Fullscreen Button -->
        <button id="fullscreenBtn" title="Fullscreen">
            <img src="./image/full.png" alt="Fullscreen">
        </button>

        <!-- Copyright -->
        <div class="copyright" data-i18n="copyright">
            Made with 💕 for Zahra's Birthday
        </div>
    </div>

    <!-- Three.js for 3D Cake -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
    if (typeof THREE !== 'undefined' && !THREE.CapsuleGeometry) {
        THREE.CapsuleGeometry = function(radius, length, capSegments, radialSegments) {
            return new THREE.CylinderGeometry(radius, radius, length + radius * 2, radialSegments || 8);
        };
    }
    </script>

    <!-- Modules with cache buster -->
    <script src="./lang.js?v=3"></script>
    <script src="./jscp/settings.js?v=3"></script>
    <script src="./jscp/timeline.js?v=3"></script>
    <script src="./jscp/3d_cake.js?v=3"></script>
    <script src="./jscp/minigame.js?v=3"></script>
    <script src="./jscp/ui.js?v=3"></script>

    <script>
        // Clear all old caches on reload to guarantee fresh execution
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(registrations => {
                for (let registration of registrations) {
                    registration.unregister();
                }
            });
            if ('caches' in window) {
                caches.keys().then(names => {
                    for (let name of names) caches.delete(name);
                });
            }
        }
    </script>
</body>

</html>
